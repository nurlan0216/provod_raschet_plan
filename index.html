<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭлектроПлан</title>
<meta name="theme-color" content="#F2B705">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ЭлектроПлан">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header class="top">
  <div class="brand">⚡ ЭлектроПлан</div>
  <div class="fs">
    <button data-act="fs-" aria-label="Уменьшить шрифт">А−</button>
    <button data-act="fs+" aria-label="Увеличить шрифт">А+</button>
  </div>
</header>
<nav id="steps" class="steps" aria-label="Шаги"></nav>
<main id="screen" tabindex="-1"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<footer class="bar">
  <button data-act="back" id="b-back">← Назад</button>
  <button data-act="undo" id="b-undo">↶ Отменить</button>
  <button data-act="next" id="b-next" class="primary">Дальше →</button>
</footer>
<dialog id="dlg">
  <p id="dlg-text"></p>
  <div class="row"><button id="dlg-no">Нет, оставить</button><button id="dlg-yes" class="danger">Да</button></div>
</dialog>
<noscript><p style="padding:16px">Для работы ЭлектроПлан нужен включённый JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
